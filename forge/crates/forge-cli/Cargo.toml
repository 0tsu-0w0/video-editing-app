[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
forge-gpu = { path = "../forge-gpu" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
