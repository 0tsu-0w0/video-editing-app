[package]
name = "studio-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "forge-studio"
path = "src/main.rs"

[dependencies]
studio-core = { path = "../studio-core" }
studio-media = { path = "../studio-media" }
studio-render = { path = "../studio-render" }
studio-track = { path = "../studio-track" }
studio-pose = { path = "../studio-pose" }
egui = "0.35"
egui-directx11 = "0.13"
egui-winit = { version = "0.35", default-features = false }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
cpal = "0.18"
rfd = "0.15"
serde = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
]
